[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc = "0.8.23"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 1_000_000

remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
  "@tokenized-strategy/=lib/tokenized-strategy/src/",
  "@periphery/=lib/tokenized-strategy-periphery/src/",
  "@vaults-v3/=lib/tokenized-strategy-periphery/lib/yearn-vaults-v3/contracts/",
  "@euler-interfaces/=lib/euler-interfaces/interfaces/",
  "@uniswap-v3-core/=lib/uniswap-v3-core/contracts/",
  "@createx-forge/=lib/createx-forge/",
]

[fuzz]
runs = 1024
